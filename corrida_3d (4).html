<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrida 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #111;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #ui h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        #ui p {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.5;
        }
        #velocidade {
            position: absolute;
            bottom: 30px;
            right: 30px;
            font-size: 42px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0,0,0,0.9);
            z-index: 10;
            text-align: right;
        }
        #nitroInfo {
            position: absolute;
            bottom: 85px;
            right: 30px;
            font-size: 16px;
            font-weight: 600;
            color: #ffaa00;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            z-index: 10;
            text-align: right;
        }
        #nitroBar {
            position: absolute;
            bottom: 115px;
            right: 30px;
            width: 160px;
            height: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            overflow: hidden;
            z-index: 10;
        }
        #nitroFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff6600, #ffaa00);
            border-radius: 5px;
            transition: width 0.1s linear;
        }
        #instrucoes {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            z-index: 10;
        }
        #mensagem {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9);
            text-align: center;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        #mensagem.show { opacity: 1; }
    </style>
</head>
<body>
    <!-- HUD estilo TurboChase -->
    <div id="tituloJogo" style="position:absolute;top:14px;left:16px;z-index:11;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.85);pointer-events:none;font-family:system-ui,sans-serif;">
        TurboChase <span style="font-size:13px;opacity:0.75;font-weight:600;">v2.0</span>
    </div>
    <div id="hudStats" style="position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:11;display:flex;gap:18px;align-items:center;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,0.9);font-weight:700;font-size:18px;color:#fff;">
        <div style="display:flex;align-items:center;gap:6px;"><span style="font-size:22px;">🏆</span><span id="pontosInfo">0</span></div>
        <div style="display:flex;align-items:center;gap:6px;"><span style="font-size:20px;">🛣️</span><span id="kmInfo">0m</span></div>
        <div style="display:flex;align-items:center;gap:6px;"><span style="font-size:20px;">🪙</span><span id="moedasInfo">0</span></div>
    </div>
    <div id="policiaInfo" style="position:absolute;top:48px;left:50%;transform:translateX(-50%);z-index:11;font-size:16px;font-weight:700;color:#ff3333;text-shadow:0 2px 8px rgba(0,0,0,0.9);pointer-events:none;text-align:center;min-height:20px;"></div>

    <!-- Minimapa canto inferior esquerdo estilo imagem 2 -->
    <div id="minimapWrap" style="position:absolute;bottom:24px;left:20px;z-index:10;padding:8px;background:#1a1a1a;border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,0.6);">
        <canvas id="minimap" width="160" height="160" style="display:block;border-radius:12px;background:#222;"></canvas>
        <div id="nitroBar" style="position:relative;bottom:auto;right:auto;width:160px;height:8px;margin-top:8px;background:#333;border-radius:4px;overflow:hidden;">
            <div id="nitroFill" style="height:100%;width:100%;background:linear-gradient(90deg,#ff6600,#ffaa00);border-radius:4px;"></div>
        </div>
    </div>

    <div id="nitroInfo" style="display:none;"></div>
    <div id="velocidade">0 km/h</div>
    <div id="mensagem"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== CONFIG ====================
        const scene = new THREE.Scene();
        // ===== DIA =====
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 120, 480);

        // ===== NUVENS =====
        const nuvens = [];
        function criarNuvem(x, y, z, escala) {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.9,
                roughness: 1,
                metalness: 0
            });
            const partes = [
                [0, 0, 0, 1],
                [1.2, 0.15, 0.3, 0.85],
                [-1.1, 0.1, -0.2, 0.8],
                [0.4, 0.5, -0.4, 0.7],
                [-0.5, 0.4, 0.5, 0.65],
                [1.8, -0.05, -0.1, 0.6],
                [-1.7, 0, 0.2, 0.55],
                [0.8, 0.3, 0.8, 0.5],
                [-0.9, 0.25, -0.6, 0.55]
            ];
            partes.forEach(([px, py, pz, s]) => {
                const blob = new THREE.Mesh(
                    new THREE.SphereGeometry(2.2 * s, 10, 8),
                    mat
                );
                blob.position.set(px * 2.5, py * 2, pz * 2);
                blob.scale.y = 0.55;
                g.add(blob);
            });
            g.position.set(x, y, z);
            g.scale.setScalar(escala);
            scene.add(g);
            nuvens.push({ mesh: g, vel: 0.25 + Math.random() * 0.5, baseX: x });
        }
        // Muitas nuvens no céu
        for (let i = 0; i < 100; i++) {
            const nx = (Math.random() - 0.5) * 1800;
            const nz = (Math.random() - 0.5) * 1800;
            const ny = 38 + Math.random() * 60;
            const esc = 1.2 + Math.random() * 4;
            criarNuvem(nx, ny, nz, esc);
        }

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 600);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Luzes de dia
        const ambient = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambient);

        const hemi = new THREE.HemisphereLight(0x87CEEB, 0x445533, 0.35);
        scene.add(hemi);

        const sun = new THREE.DirectionalLight(0xfff5e0, 1.25);
        sun.position.set(120, 180, 80);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 600;
        sun.shadow.camera.left = -300;
        sun.shadow.camera.right = 300;
        sun.shadow.camera.top = 300;
        sun.shadow.camera.bottom = -300;
        scene.add(sun);

        // Sol visual no céu
        const solMesh = new THREE.Mesh(
            new THREE.SphereGeometry(14, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffee66 })
        );
        solMesh.position.set(200, 220, 150);
        scene.add(solMesh);
        const solHalo = new THREE.Mesh(
            new THREE.SphereGeometry(22, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xfff0a0, transparent: true, opacity: 0.25 })
        );
        solHalo.position.copy(solMesh.position);
        scene.add(solHalo);

        // ==================== CIDADE (mapa 20x maior com quarteirões) ====================
        // Grade de ruas
        const RUA_LARGURA = 18;          // largura das ruas
        const QUARTEIRAO = 55;           // tamanho de cada quarteirão (bloco)
        const CELULA = RUA_LARGURA + QUARTEIRAO; // espaçamento entre centros de ruas
        const NUM_BLOCOS = 14;           // 14x14 quarteirões → cidade enorme
        const cidadeSize = NUM_BLOCOS * CELULA + RUA_LARGURA;

        const prediosColisao = []; // colisão com prédios/casas
        const rampas = []; // física das rampas
        const lagos = []; // zonas de água (cair = afundar / reiniciar)

        // Chão da cidade (asfalto geral)
        const chaoGeo = new THREE.PlaneGeometry(cidadeSize + 10, cidadeSize + 10);
        const chaoMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.9 });
        const chao = new THREE.Mesh(chaoGeo, chaoMat);
        chao.rotation.x = -Math.PI / 2;
        chao.position.y = -0.02;
        chao.receiveShadow = true;
        scene.add(chao);

        // ===== AREIA 50m (2,5x) + OCEANO ao redor da cidade =====
        const BORDA_CIDADE = cidadeSize / 2;
        const AREIA_LARGURA = 50;
        const OCEANO_INICIO = BORDA_CIDADE + AREIA_LARGURA;
        const oceanoMat = new THREE.MeshStandardMaterial({
            color: 0x0a4a8a,
            transparent: true,
            opacity: 0.85,
            metalness: 0.35,
            roughness: 0.25,
            emissive: 0x002244,
            emissiveIntensity: 0.12
        });
        const OCEANO_TAM = 900;
        const ladosOceano = [
            { x: 0, z: OCEANO_INICIO + OCEANO_TAM / 2, w: cidadeSize + OCEANO_TAM * 2 + AREIA_LARGURA * 2, d: OCEANO_TAM },
            { x: 0, z: -(OCEANO_INICIO + OCEANO_TAM / 2), w: cidadeSize + OCEANO_TAM * 2 + AREIA_LARGURA * 2, d: OCEANO_TAM },
            { x: OCEANO_INICIO + OCEANO_TAM / 2, z: 0, w: OCEANO_TAM, d: cidadeSize + AREIA_LARGURA * 2 },
            { x: -(OCEANO_INICIO + OCEANO_TAM / 2), z: 0, w: OCEANO_TAM, d: cidadeSize + AREIA_LARGURA * 2 }
        ];
        ladosOceano.forEach(lado => {
            const agua = new THREE.Mesh(
                new THREE.PlaneGeometry(lado.w, lado.d),
                oceanoMat
            );
            agua.rotation.x = -Math.PI / 2;
            agua.position.set(lado.x, 0.05, lado.z);
            agua.receiveShadow = true;
            scene.add(agua);
        });
        const areiaMat = new THREE.MeshStandardMaterial({ color: 0xc2b280, roughness: 0.95 });
        [[1], [-1]].forEach(([sig]) => {
            const areia = new THREE.Mesh(
                new THREE.PlaneGeometry(cidadeSize + AREIA_LARGURA * 2, AREIA_LARGURA),
                areiaMat
            );
            areia.rotation.x = -Math.PI / 2;
            areia.position.set(0, 0.03, sig * (BORDA_CIDADE + AREIA_LARGURA / 2));
            scene.add(areia);
        });
        [[1], [-1]].forEach(([sig]) => {
            const areia = new THREE.Mesh(
                new THREE.PlaneGeometry(AREIA_LARGURA, cidadeSize),
                areiaMat
            );
            areia.rotation.x = -Math.PI / 2;
            areia.position.set(sig * (BORDA_CIDADE + AREIA_LARGURA / 2), 0.03, 0);
            scene.add(areia);
        });

        function estaNoOceano(wx, wz) {
            return Math.abs(wx) > OCEANO_INICIO || Math.abs(wz) > OCEANO_INICIO;
        }

        // ===== ILHAS COM COQUEIROS =====
        function criarCoqueiro(x, z) {
            const g = new THREE.Group();
            const troncoMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2a, roughness: 0.9 });
            // Tronco segmentado (curvado)
            let py = 0;
            let px = 0;
            for (let s = 0; s < 5; s++) {
                const seg = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.22 - s * 0.02, 0.26 - s * 0.02, 1.2, 8),
                    troncoMat
                );
                px += (Math.random() - 0.5) * 0.15;
                py += 1.15;
                seg.position.set(px, py, 0);
                seg.rotation.z = (Math.random() - 0.5) * 0.2;
                seg.castShadow = true;
                g.add(seg);
            }
            const folhaMat = new THREE.MeshStandardMaterial({ color: 0x2d8a3e, side: THREE.DoubleSide, roughness: 0.8 });
            for (let i = 0; i < 8; i++) {
                const folhaG = new THREE.Group();
                for (let j = 0; j < 4; j++) {
                    const folha = new THREE.Mesh(
                        new THREE.BoxGeometry(0.12, 0.06, 1.4 - j * 0.2),
                        folhaMat
                    );
                    folha.position.set(0, 0, 0.7 + j * 0.55);
                    folha.rotation.x = 0.15 * j;
                    folhaG.add(folha);
                }
                folhaG.position.set(px, py + 0.6, 0);
                folhaG.rotation.y = (i / 8) * Math.PI * 2;
                folhaG.rotation.x = 0.4 + Math.random() * 0.3;
                g.add(folhaG);
            }
            for (let i = 0; i < 4; i++) {
                const coco = new THREE.Mesh(
                    new THREE.SphereGeometry(0.2, 8, 8),
                    new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.7 })
                );
                coco.position.set(px + Math.cos(i) * 0.35, py + 0.2, Math.sin(i) * 0.35);
                g.add(coco);
            }
            g.position.set(x, 0, z);
            scene.add(g);
        }
        function criarIlha(x, z, raio) {
            const g = new THREE.Group();
            // Base de areia em camadas
            const areia1 = new THREE.Mesh(
                new THREE.CylinderGeometry(raio, raio * 1.15, 1.2, 16),
                new THREE.MeshStandardMaterial({ color: 0xe8d5a8, roughness: 0.95 })
            );
            areia1.position.y = 0.4;
            areia1.receiveShadow = true;
            g.add(areia1);
            const areia2 = new THREE.Mesh(
                new THREE.CylinderGeometry(raio * 0.7, raio * 0.85, 0.8, 14),
                new THREE.MeshStandardMaterial({ color: 0xd4c090, roughness: 0.95 })
            );
            areia2.position.y = 1.1;
            g.add(areia2);
            // Mancha de grama no centro
            const grama = new THREE.Mesh(
                new THREE.CylinderGeometry(raio * 0.4, raio * 0.45, 0.3, 12),
                new THREE.MeshStandardMaterial({ color: 0x3a9a4a, roughness: 0.9 })
            );
            grama.position.y = 1.55;
            g.add(grama);
            // Pedras
            for (let i = 0; i < 5; i++) {
                const pedra = new THREE.Mesh(
                    new THREE.SphereGeometry(0.4 + Math.random() * 0.5, 6, 5),
                    new THREE.MeshStandardMaterial({ color: 0x888880, roughness: 0.95 })
                );
                const a = Math.random() * Math.PI * 2;
                const d = raio * (0.4 + Math.random() * 0.45);
                pedra.position.set(Math.cos(a) * d, 1.0, Math.sin(a) * d);
                pedra.scale.y = 0.6;
                g.add(pedra);
            }
            g.position.set(x, 0, z);
            scene.add(g);
            const n = 4 + Math.floor(Math.random() * 5);
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2;
                const d = Math.random() * raio * 0.55;
                criarCoqueiro(x + Math.cos(a) * d, z + Math.sin(a) * d);
            }
        }
        // Ilhas bem depois da barreira (≥ 65m)
        const ilhasPos = [
            [OCEANO_INICIO + 80, 90], [-(OCEANO_INICIO + 100), -70],
            [100, OCEANO_INICIO + 90], [-80, -(OCEANO_INICIO + 85)],
            [OCEANO_INICIO + 150, -160], [-(OCEANO_INICIO + 130), 140]
        ];
        ilhasPos.forEach(([ix, iz]) => criarIlha(ix, iz, 14 + Math.random() * 12));

        // ===== NAVIOS =====
        const navios = [];
        function criarNavio() {
            const g = new THREE.Group();
            const azul = new THREE.MeshStandardMaterial({ color: 0x1a3a6a, metalness: 0.3, roughness: 0.5 });
            const branco = new THREE.MeshStandardMaterial({ color: 0xf0f0f5, roughness: 0.5 });
            const vermelho = new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: 0.6 });
            const preto = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 });
            // Casco principal (afilado)
            const casco = new THREE.Mesh(new THREE.BoxGeometry(18, 3.2, 5), azul);
            casco.position.y = 1.2;
            g.add(casco);
            // Proa
            const proa = new THREE.Mesh(new THREE.BoxGeometry(4, 2.8, 3.5), azul);
            proa.position.set(10, 1.1, 0);
            proa.rotation.z = -0.15;
            g.add(proa);
            // Fundo vermelho
            const fundo = new THREE.Mesh(new THREE.BoxGeometry(18.2, 0.6, 5.2), vermelho);
            fundo.position.y = -0.1;
            g.add(fundo);
            // Faixa branca
            const faixa = new THREE.Mesh(new THREE.BoxGeometry(18.1, 0.35, 5.15), branco);
            faixa.position.y = 2.5;
            g.add(faixa);
            // Superestrutura
            const super1 = new THREE.Mesh(new THREE.BoxGeometry(6, 2.5, 4), branco);
            super1.position.set(-1, 4.2, 0);
            g.add(super1);
            const super2 = new THREE.Mesh(new THREE.BoxGeometry(4, 1.8, 3.2), branco);
            super2.position.set(-1, 6.2, 0);
            g.add(super2);
            // Ponte / janelas
            const ponte = new THREE.Mesh(
                new THREE.BoxGeometry(3.5, 1.2, 3.4),
                new THREE.MeshStandardMaterial({ color: 0x88aacc, transparent: true, opacity: 0.7, metalness: 0.5 })
            );
            ponte.position.set(-0.5, 7.5, 0);
            g.add(ponte);
            // Chaminés
            [[1.5, 0.8], [1.5, -0.8]].forEach(([cz, cx]) => {
                const ch = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 2.8, 8), preto);
                ch.position.set(cx, 5.5, cz);
                g.add(ch);
                const topoCh = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.5, 0.4, 8), vermelho);
                topoCh.position.set(cx, 7.0, cz);
                g.add(topoCh);
            });
            // Mastro
            const mastro = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 5, 6), preto);
            mastro.position.set(-3, 7.5, 0);
            g.add(mastro);
            // Guindaste / detalhe no convés
            const guind = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 4), preto);
            guind.position.set(5, 3.5, 0);
            guind.rotation.z = 0.4;
            g.add(guind);
            // Escotilhas
            for (let i = 0; i < 3; i++) {
                const esc = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.3, 8), preto);
                esc.position.set(3 + i * 2.5, 2.9, 0);
                g.add(esc);
            }
            // Antena
            const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2, 4), preto);
            ant.position.set(-1, 9.2, 0);
            g.add(ant);
            scene.add(g);
            const ang = Math.random() * Math.PI * 2;
            // Bem no fundo do oceano (longe, no horizonte)
            const dist = OCEANO_INICIO + 180 + Math.random() * 200;
            return {
                mesh: g,
                ang,
                dist,
                vel: 0.04 + Math.random() * 0.04, // mais lento no horizonte
                sentido: Math.random() > 0.5 ? 1 : -1
            };
        }
        for (let i = 0; i < 6; i++) navios.push(criarNavio());

        function atualizarNavios(dt) {
            navios.forEach(n => {
                n.ang += n.vel * n.sentido * dt * 0.12;
                n.mesh.position.set(
                    Math.cos(n.ang) * n.dist,
                    0.5,
                    Math.sin(n.ang) * n.dist
                );
                n.mesh.rotation.y = n.ang + (n.sentido > 0 ? Math.PI / 2 : -Math.PI / 2);
            });
        }

        // ===== PÁSSAROS (atravessam o mapa, não seguem o jogador) =====
        const passaros = [];
        function criarPassaro() {
            const g = new THREE.Group();
            const corpo = new THREE.Mesh(
                new THREE.SphereGeometry(0.25, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0x222222 })
            );
            g.add(corpo);
            const asaL = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 0.06, 0.35),
                new THREE.MeshStandardMaterial({ color: 0x333333 })
            );
            asaL.position.set(-0.5, 0, 0);
            g.add(asaL);
            const asaR = asaL.clone();
            asaR.position.x = 0.5;
            g.add(asaR);
            g.visible = false;
            scene.add(g);
            return {
                mesh: g, asaL, asaR,
                ativo: false,
                timer: 15 + Math.random() * 40, // espera longa antes de aparecer
                phase: Math.random() * Math.PI * 2,
                vx: 0, vz: 0, x: 0, y: 30, z: 0
            };
        }
        // Poucos pássaros (aparecem menos vezes por minuto)
        for (let i = 0; i < 5; i++) passaros.push(criarPassaro());

        function iniciarVooPassaro(p) {
            const eixo = Math.random() > 0.5 ? 'x' : 'z';
            const sentido = Math.random() > 0.5 ? 1 : -1;
            const margem = half + 60;
            p.y = 20 + Math.random() * 35;
            if (eixo === 'x') {
                p.x = -sentido * margem;
                p.z = (Math.random() - 0.5) * half * 1.6;
                p.vx = sentido * (12 + Math.random() * 10);
                p.vz = (Math.random() - 0.5) * 3;
            } else {
                p.z = -sentido * margem;
                p.x = (Math.random() - 0.5) * half * 1.6;
                p.vz = sentido * (12 + Math.random() * 10);
                p.vx = (Math.random() - 0.5) * 3;
            }
            p.mesh.position.set(p.x, p.y, p.z);
            p.mesh.rotation.y = Math.atan2(p.vx, p.vz);
            p.mesh.visible = true;
            p.ativo = true;
        }

        function atualizarPassaros(dt) {
            const lim = half + 80;
            passaros.forEach(p => {
                if (!p.ativo) {
                    p.timer -= dt;
                    if (p.timer <= 0) {
                        iniciarVooPassaro(p);
                        p.timer = 25 + Math.random() * 50; // 25–75s entre voos
                    }
                    return;
                }
                p.x += p.vx * dt;
                p.z += p.vz * dt;
                p.y += Math.sin(performance.now() * 0.002 + p.phase) * 0.02;
                p.mesh.position.set(p.x, p.y, p.z);
                p.mesh.rotation.y = Math.atan2(p.vx, p.vz);
                const flap = Math.sin(performance.now() * 0.012 + p.phase) * 0.55;
                p.asaL.rotation.z = flap;
                p.asaR.rotation.z = -flap;
                if (Math.abs(p.x) > lim || Math.abs(p.z) > lim) {
                    p.mesh.visible = false;
                    p.ativo = false;
                }
            });
        }

        // Função para criar faixa de rua
        function criarRua(x, z, largura, comprimento, rotY = 0) {
            const geo = new THREE.PlaneGeometry(largura, comprimento);
            const mat = new THREE.MeshStandardMaterial({ color: 0x3a3a40, roughness: 0.85 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.rotation.z = rotY;
            mesh.position.set(x, 0.01, z);
            mesh.receiveShadow = true;
            scene.add(mesh);
        }

        // Função linha (faixas)
        function criarLinha(largura, comprimento, x, z, cor = 0xffffff, rot = 0) {
            const geo = new THREE.PlaneGeometry(largura, comprimento);
            const mat = new THREE.MeshBasicMaterial({ color: cor });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.rotation.z = rot;
            mesh.position.set(x, 0.03, z);
            scene.add(mesh);
        }

        // === Cria a grade de ruas (horizontais + verticais) ===
        const half = (NUM_BLOCOS * CELULA) / 2;

        // Ruas horizontais (ao longo de X)
        for (let i = 0; i <= NUM_BLOCOS; i++) {
            const z = -half + i * CELULA;
            criarRua(0, z, cidadeSize, RUA_LARGURA);

            // Linha central tracejada
            for (let x = -half; x < half; x += 8) {
                criarLinha(3.5, 0.25, x + 2, z, 0xffee00);
            }
            // Bordas da rua
            criarLinha(cidadeSize, 0.3, 0, z - RUA_LARGURA/2 + 0.2, 0xffffff);
            criarLinha(cidadeSize, 0.3, 0, z + RUA_LARGURA/2 - 0.2, 0xffffff);
        }

        // Ruas verticais (ao longo de Z)
        for (let i = 0; i <= NUM_BLOCOS; i++) {
            const x = -half + i * CELULA;
            criarRua(x, 0, RUA_LARGURA, cidadeSize);

            for (let z = -half; z < half; z += 8) {
                criarLinha(0.25, 3.5, x, z + 2, 0xffee00);
            }
            criarLinha(0.3, cidadeSize, x - RUA_LARGURA/2 + 0.2, 0, 0xffffff);
            criarLinha(0.3, cidadeSize, x + RUA_LARGURA/2 - 0.2, 0, 0xffffff);
        }

        // === Calçadas ao redor dos quarteirões ===
        const calcadaMat = new THREE.MeshStandardMaterial({ color: 0xb0aaa0, roughness: 0.95 });
        for (let bx = 0; bx < NUM_BLOCOS; bx++) {
            for (let bz = 0; bz < NUM_BLOCOS; bz++) {
                const cx = -half + RUA_LARGURA/2 + QUARTEIRAO/2 + bx * CELULA;
                const cz = -half + RUA_LARGURA/2 + QUARTEIRAO/2 + bz * CELULA;
                // Calçada em anel (borda do quarteirão)
                const calc = new THREE.Mesh(
                    new THREE.PlaneGeometry(QUARTEIRAO - 1, QUARTEIRAO - 1),
                    calcadaMat
                );
                calc.rotation.x = -Math.PI / 2;
                calc.position.set(cx, 0.025, cz);
                calc.receiveShadow = true;
                scene.add(calc);
            }
        }

        // === Faixas de pedestre nos cruzamentos (só retângulos) ===
        function criarFaixaPedestre(x, z, rotY) {
            const grupo = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85 });
            // 6 retângulos paralelos
            for (let s = -2.5; s <= 2.5; s++) {
                const faixa = new THREE.Mesh(
                    new THREE.BoxGeometry(0.7, 0.04, 5.5),
                    mat
                );
                faixa.position.set(s * 1.15, 0.03, 0);
                faixa.receiveShadow = true;
                grupo.add(faixa);
            }
            // Bordas laterais finas
            [-3.6, 3.6].forEach(bx => {
                const borda = new THREE.Mesh(
                    new THREE.BoxGeometry(0.15, 0.045, 5.5),
                    mat
                );
                borda.position.set(bx, 0.03, 0);
                grupo.add(borda);
            });
            grupo.position.set(x, 0, z);
            grupo.rotation.y = rotY;
            scene.add(grupo);
        }

        for (let i = 0; i <= NUM_BLOCOS; i++) {
            for (let j = 0; j <= NUM_BLOCOS; j++) {
                const ix = -half + i * CELULA;
                const iz = -half + j * CELULA;
                // Quatro faixas, uma em cada lado do cruzamento
                const off = RUA_LARGURA * 0.42;
                criarFaixaPedestre(ix, iz - off, 0);           // sul
                criarFaixaPedestre(ix, iz + off, 0);           // norte
                criarFaixaPedestre(ix - off, iz, Math.PI / 2); // oeste
                criarFaixaPedestre(ix + off, iz, Math.PI / 2); // leste
            }
        }

        // === Posto de gasolina ===
        function criarPosto(x, z) {
            const grupo = new THREE.Group();
            // Tamanho do quarteirão inteiro
            const L = QUARTEIRAO - 6;
            const P = QUARTEIRAO - 6;

            // Piso de asfalto do posto
            const piso = new THREE.Mesh(
                new THREE.PlaneGeometry(L, P),
                new THREE.MeshStandardMaterial({ color: 0x3a3a3e, roughness: 0.95 })
            );
            piso.rotation.x = -Math.PI / 2;
            piso.position.y = 0.05;
            piso.receiveShadow = true;
            grupo.add(piso);

            // Cobertura grande
            const teto = new THREE.Mesh(
                new THREE.BoxGeometry(L * 0.85, 0.5, P * 0.55),
                new THREE.MeshStandardMaterial({ color: 0xe82500, metalness: 0.35, roughness: 0.45 })
            );
            teto.position.set(0, 7, 2);
            teto.castShadow = true;
            grupo.add(teto);
            // Faixa branca na cobertura
            const faixaTeto = new THREE.Mesh(
                new THREE.BoxGeometry(L * 0.85, 0.25, 0.4),
                new THREE.MeshStandardMaterial({ color: 0xffffff })
            );
            faixaTeto.position.set(0, 7.15, 2 + P * 0.27);
            grupo.add(faixaTeto);

            // Pilares da cobertura (grade)
            for (let i = -2; i <= 2; i++) {
                for (let j = -1; j <= 1; j++) {
                    const p = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.35, 0.4, 7, 8),
                        new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.5, roughness: 0.4 })
                    );
                    p.position.set(i * (L * 0.18), 3.5, 2 + j * (P * 0.18));
                    p.castShadow = true;
                    grupo.add(p);
                }
            }

            // Loja de conveniência (fundo)
            const loja = new THREE.Mesh(
                new THREE.BoxGeometry(L * 0.45, 5, 8),
                new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.7 })
            );
            loja.position.set(0, 2.5, -P * 0.32);
            loja.castShadow = true;
            grupo.add(loja);
            // Faixa da loja
            const faixaLoja = new THREE.Mesh(
                new THREE.BoxGeometry(L * 0.45 + 0.2, 1.2, 0.2),
                new THREE.MeshStandardMaterial({ color: 0xe82500, emissive: 0x661100, emissiveIntensity: 0.25 })
            );
            faixaLoja.position.set(0, 4.6, -P * 0.32 + 4.15);
            grupo.add(faixaLoja);
            // Porta da loja
            const portaLoja = new THREE.Mesh(
                new THREE.BoxGeometry(3, 3, 0.15),
                new THREE.MeshStandardMaterial({ color: 0x66aaff, transparent: true, opacity: 0.5 })
            );
            portaLoja.position.set(0, 1.6, -P * 0.32 + 4.1);
            grupo.add(portaLoja);

            // Filas de bombas — só cada bomba colide (corredores livres)
            for (let fila = -1; fila <= 1; fila++) {
                for (let i = -2; i <= 2; i++) {
                    const bx = i * 5;
                    const bz = 2 + fila * 6;
                    // Base da bomba
                    const base = new THREE.Mesh(
                        new THREE.BoxGeometry(1.8, 0.25, 1.8),
                        new THREE.MeshStandardMaterial({ color: 0x333333 })
                    );
                    base.position.set(bx, 0.2, bz);
                    grupo.add(base);
                    // Corpo da bomba
                    const bomba = new THREE.Mesh(
                        new THREE.BoxGeometry(1.3, 2.2, 1.0),
                        new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.4, roughness: 0.4 })
                    );
                    bomba.position.set(bx, 1.3, bz);
                    grupo.add(bomba);
                    // Tela da bomba
                    const tela = new THREE.Mesh(
                        new THREE.BoxGeometry(0.9, 0.6, 0.08),
                        new THREE.MeshStandardMaterial({ color: 0x33ff66, emissive: 0x11aa33, emissiveIntensity: 0.4 })
                    );
                    tela.position.set(bx, 1.8, bz + 0.55);
                    grupo.add(tela);
                    // Colisão só da bomba (não do posto inteiro)
                    prediosColisao.push({ x: x + bx, z: z + bz, w: 1.1, d: 1.1, tipo: 'posto' });
                }
            }

            // Totem / placa alta na entrada
            const totemX = L * 0.38;
            const totemZ = P * 0.4;
            const totem = new THREE.Mesh(
                new THREE.BoxGeometry(2, 12, 1),
                new THREE.MeshStandardMaterial({ color: 0xe82500 })
            );
            totem.position.set(totemX, 6, totemZ);
            totem.castShadow = true;
            grupo.add(totem);
            const totemTop = new THREE.Mesh(
                new THREE.BoxGeometry(2.4, 2, 1.2),
                new THREE.MeshStandardMaterial({ color: 0xffffff })
            );
            totemTop.position.set(totemX, 13, totemZ);
            grupo.add(totemTop);

            grupo.position.set(x, 0, z);
            scene.add(grupo);

            // Colisão só da loja de conveniência e do totem
            prediosColisao.push({ x: x, z: z - P * 0.32, w: L * 0.25, d: 4.5, tipo: 'posto' });
            prediosColisao.push({ x: x + totemX, z: z + totemZ, w: 1.4, d: 1.0, tipo: 'posto' });
            // Pilares também colidem individualmente
            for (let i = -2; i <= 2; i++) {
                for (let j = -1; j <= 1; j++) {
                    prediosColisao.push({
                        x: x + i * (L * 0.18),
                        z: z + 2 + j * (P * 0.18),
                        w: 0.55,
                        d: 0.55,
                        tipo: 'posto'
                    });
                }
            }
        }

        // === Grama + Rampa ===
        function criarGramaQuarteirao(cx, cz) {
            // Tapete de grama cobrindo o quarteirão
            const grama = new THREE.Mesh(
                new THREE.PlaneGeometry(QUARTEIRAO - 4, QUARTEIRAO - 4),
                new THREE.MeshStandardMaterial({ color: 0x3a9a4a, roughness: 0.9 })
            );
            grama.rotation.x = -Math.PI / 2;
            grama.position.set(cx, 0.04, cz);
            grama.receiveShadow = true;
            scene.add(grama);

            // Algumas árvores nos cantos
            for (let t = 0; t < 3; t++) {
                const ox = (Math.random() > 0.5 ? 1 : -1) * (16 + Math.random() * 6);
                const oz = (Math.random() > 0.5 ? 1 : -1) * (16 + Math.random() * 6);
                criarArvore(cx + ox, cz + oz);
            }
        }

        // Dois tamanhos de rampa: pequena e grande
        const TAMANHOS_RAMPA = {
            pequena: { largura: 10, comprimento: 14, altura: 3.0 },
            grande:  { largura: 14, comprimento: 22, altura: 5.0 }
        };

        function criarRampa(x, z, rotY, tamanho = 'pequena') {
            const t = TAMANHOS_RAMPA[tamanho] || TAMANHOS_RAMPA.pequena;
            const largura = t.largura;
            const comprimento = t.comprimento;
            const altura = t.altura;

            const grupo = new THREE.Group();
            const angulo = Math.atan(altura / comprimento);

            // Só a rampa inclinada (sem plataforma no topo)
            const rampaGeo = new THREE.BoxGeometry(largura, 0.4, comprimento);
            const rampaMat = new THREE.MeshStandardMaterial({ color: 0x666670, roughness: 0.7, metalness: 0.15 });
            const rampa = new THREE.Mesh(rampaGeo, rampaMat);
            rampa.rotation.x = -angulo;
            rampa.position.y = Math.sin(angulo) * (comprimento / 2) * 0.5 + 0.2;
            rampa.castShadow = true;
            rampa.receiveShadow = true;
            grupo.add(rampa);

            // Laterais de suporte (sem proteção/plataforma em cima)
            const latMat = new THREE.MeshStandardMaterial({ color: 0x555560, roughness: 0.8 });
            [-largura/2 + 0.3, largura/2 - 0.3].forEach(lx => {
                const lat = new THREE.Mesh(new THREE.BoxGeometry(0.45, altura * 0.75, comprimento * 0.65), latMat);
                lat.position.set(lx, altura * 0.3, 0);
                lat.castShadow = true;
                grupo.add(lat);
            });

            grupo.position.set(x, 0, z);
            grupo.rotation.y = rotY;
            scene.add(grupo);

            // Física: só a rampa inclinada (sem plataforma)
            rampas.push({
                x, z, rotY,
                largura: largura / 2 - 0.3,
                comprimento: comprimento / 2 - 0.5,
                altura,
                angulo,
                lancamento: tamanho === 'grande' ? 10 : 8
            });
        }

        // ===== LAGO (água) =====
        function criarLago(cx, cz) {
            const tamanho = QUARTEIRAO - 8;
            // Água
            const agua = new THREE.Mesh(
                new THREE.PlaneGeometry(tamanho, tamanho),
                new THREE.MeshStandardMaterial({
                    color: 0x1a8cff,
                    transparent: true,
                    opacity: 0.75,
                    metalness: 0.3,
                    roughness: 0.2,
                    emissive: 0x003366,
                    emissiveIntensity: 0.15
                })
            );
            agua.rotation.x = -Math.PI / 2;
            agua.position.set(cx, 0.08, cz);
            agua.receiveShadow = true;
            scene.add(agua);

            // Margem (areia / terra)
            const margem = new THREE.Mesh(
                new THREE.PlaneGeometry(tamanho + 6, tamanho + 6),
                new THREE.MeshStandardMaterial({ color: 0xc2a878, roughness: 0.95 })
            );
            margem.rotation.x = -Math.PI / 2;
            margem.position.set(cx, 0.03, cz);
            margem.receiveShadow = true;
            scene.add(margem);

            // Zona de afogamento
            lagos.push({
                x: cx,
                z: cz,
                raio: tamanho / 2 - 2
            });

            // Duas rampas em lados opostos para pular o lago
            criarRampa(cx, cz + tamanho / 2 + 2, 0, 'pequena');           // sul → norte
            criarRampa(cx, cz - tamanho / 2 - 2, Math.PI, 'pequena');     // norte → sul
        }

        // Calcula altura do chão em (wx, wz) — só em cima da rampa de verdade
        function alturaNoChao(wx, wz) {
            let maxH = 0;
            let pitch = 0;
            let onRamp = false;
            let lancamento = 8;

            for (const r of rampas) {
                // Mundo → local da rampa
                const dx = wx - r.x;
                const dz = wz - r.z;
                const cos = Math.cos(-r.rotY);
                const sin = Math.sin(-r.rotY);
                const lx = dx * cos - dz * sin;
                const lz = dx * sin + dz * cos;

                // Fora da largura da rampa → ignora
                if (Math.abs(lx) > r.largura) continue;

                // Fora do comprimento da rampa → ignora
                if (lz < -r.comprimento || lz > r.comprimento) continue;

                // Progresso na rampa: 0 na base (+Z), 1 no topo (-Z)
                const t = (r.comprimento - lz) / (r.comprimento * 2);
                const h = Math.max(0, Math.min(1, t)) * r.altura;

                // Só considera "na rampa" se a altura for relevante
                if (h > 0.15 && h >= maxH) {
                    maxH = h;
                    pitch = -r.angulo;
                    onRamp = true;
                    lancamento = r.lancamento || 8;
                }
            }
            return { h: maxH, pitch, onRamp, lancamento };
        }

        // === Preenche os quarteirões ===
        const coresCasa = [0xe8d5b7, 0xf5e6c8, 0xd4c4a8, 0xc9b8a0, 0xe0c8a0, 0xf0e0c0, 0xd8c0a0];
        const coresPredio = [0x6a7a8a, 0x5a6a7a, 0x7a8a9a, 0x4a5a6a, 0x8a7a6a, 0x5c6c7c, 0x6b5b4b];
        // Dados dos quarteirões para o minimapa (vista de cima)
        const mapaQuarteiroes = [];

        for (let bx = 0; bx < NUM_BLOCOS; bx++) {
            for (let bz = 0; bz < NUM_BLOCOS; bz++) {
                const cx = -half + RUA_LARGURA/2 + QUARTEIRAO/2 + bx * CELULA;
                const cz = -half + RUA_LARGURA/2 + QUARTEIRAO/2 + bz * CELULA;

                const tipo = Math.random();
                let corMapa = '#888888';

                if (tipo < 0.08) {
                    // ===== LAGO com rampas para pular =====
                    criarLago(cx, cz);
                    corMapa = '#1a8cff';
                } else if (tipo < 0.22) {
                    // ===== Quarteirão só de GRAMA + 1 RAMPA =====
                    criarGramaQuarteirao(cx, cz);
                    const rot = Math.floor(Math.random() * 4) * (Math.PI / 2);
                    criarRampa(cx, cz, rot, 'pequena');
                    corMapa = '#3a9a4a';
                } else if (tipo < 0.48) {
                    // Residencial
                    corMapa = '#e8d5b7'; // bege casas
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 2; j++) {
                            const ox = (i - 1) * 14 + (Math.random()-0.5)*3;
                            const oz = (j - 0.5) * 16 + (Math.random()-0.5)*3;
                            criarCasa(
                                cx + ox, cz + oz,
                                7 + Math.random()*3,
                                6 + Math.random()*2,
                                3.2 + Math.random()*2,
                                coresCasa[Math.floor(Math.random()*coresCasa.length)]
                            );
                        }
                    }
                    for (let t = 0; t < 2; t++) {
                        const ox = (Math.random() > 0.5 ? 1 : -1) * (14 + Math.random() * 6);
                        const oz = (Math.random() > 0.5 ? 1 : -1) * (14 + Math.random() * 6);
                        criarArvore(cx + ox, cz + oz);
                    }
                } else if (tipo < 0.62) {
                    // ===== Comércio especial (mercado, hotel, loja, shopping, hospital, posto) =====
                    const comercio = Math.random();
                    if (comercio < 0.18) {
                        criarSupermercado(cx, cz);
                        corMapa = '#00aa44'; // verde mercado
                    } else if (comercio < 0.32) {
                        criarHotel(cx, cz);
                        corMapa = '#d4a574'; // bege hotel
                    } else if (comercio < 0.50) {
                        // Várias lojas no quarteirão
                        corMapa = '#c4a090'; // lojas
                        const coresLoja = [0xe8c4a8, 0xa8c4d8, 0xd4b8a0, 0xb8c8b0, 0xd8c0c8, 0xc0c0d0];
                        for (let i = 0; i < 2; i++) {
                            for (let j = 0; j < 2; j++) {
                                const ox = (i - 0.5) * 18;
                                const oz = (j - 0.5) * 16;
                                criarLoja(cx + ox, cz + oz, coresLoja[Math.floor(Math.random() * coresLoja.length)]);
                            }
                        }
                    } else if (comercio < 0.68) {
                        criarShopping(cx, cz);
                        corMapa = '#7722aa'; // roxo shopping
                    } else if (comercio < 0.85) {
                        criarHospital(cx, cz);
                        corMapa = '#ffffff'; // branco hospital
                    } else {
                        criarPosto(cx, cz);
                        corMapa = '#e82500'; // vermelho posto
                    }
                } else if (tipo < 0.82) {
                    // Misto / comercial comum
                    corMapa = '#6a7a8a'; // cinza prédios
                    const n = 2 + Math.floor(Math.random()*2);
                    for (let i = 0; i < n; i++) {
                        for (let j = 0; j < n; j++) {
                            const ox = (i - (n-1)/2) * (QUARTEIRAO / n * 0.75);
                            const oz = (j - (n-1)/2) * (QUARTEIRAO / n * 0.75);
                            if (Math.random() > 0.3) {
                                criarPredio(
                                    cx + ox, cz + oz,
                                    10 + Math.random()*6,
                                    10 + Math.random()*5,
                                    3 + Math.floor(Math.random()*6),
                                    coresPredio[Math.floor(Math.random()*coresPredio.length)]
                                );
                            } else {
                                criarLoja(cx + ox, cz + oz);
                            }
                        }
                    }
                } else {
                    // Prédios altos
                    corMapa = '#4a5a6a'; // cinza escuro
                    criarPredio(cx - 12, cz - 10, 14, 14, 7 + Math.floor(Math.random()*6), coresPredio[Math.floor(Math.random()*coresPredio.length)]);
                    criarPredio(cx + 12, cz + 10, 12, 13, 5 + Math.floor(Math.random()*5), coresPredio[Math.floor(Math.random()*coresPredio.length)]);
                    if (Math.random() > 0.4) {
                        criarPredio(cx + 8, cz - 12, 11, 10, 4 + Math.floor(Math.random()*4), coresPredio[Math.floor(Math.random()*coresPredio.length)]);
                    }
                }

                let tipoBloco = 'misto';
                if (corMapa === '#1a8cff') tipoBloco = 'lago';
                else if (corMapa === '#3a9a4a') tipoBloco = 'grama';
                else if (corMapa === '#e8d5b7') tipoBloco = 'casa';
                else if (corMapa === '#00aa44') tipoBloco = 'mercado';
                else if (corMapa === '#d4a574') tipoBloco = 'hotel';
                else if (corMapa === '#c4a090') tipoBloco = 'loja';
                else if (corMapa === '#7722aa') tipoBloco = 'shopping';
                else if (corMapa === '#ffffff') tipoBloco = 'hospital';
                else if (corMapa === '#e82500') tipoBloco = 'posto';
                else if (corMapa === '#6a7a8a' || corMapa === '#4a5a6a') tipoBloco = 'predio';
                mapaQuarteiroes.push({ cx, cz, cor: corMapa, tipo: tipoBloco });
            }
        }

        // (árvores das calçadas removidas para não ficar no meio das ruas)

        // ===== POSTES DE LUZ (dentro do quarteirão, nas quinas) =====
        function criarPosteLuz(x, z) {
            const g = new THREE.Group();
            const metal = new THREE.MeshStandardMaterial({ color: 0x3a3a42, metalness: 0.6, roughness: 0.4 });
            const metalEscuro = new THREE.MeshStandardMaterial({ color: 0x222228, metalness: 0.5, roughness: 0.5 });

            // Base
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(0.35, 0.4, 0.25, 8),
                metalEscuro
            );
            base.position.y = 0.12;
            g.add(base);

            // Poste principal
            const poste = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.14, 6.2, 8),
                metal
            );
            poste.position.y = 3.3;
            poste.castShadow = true;
            g.add(poste);

            // Anéis decorativos
            [1.5, 3.5, 5.5].forEach(hy => {
                const anel = new THREE.Mesh(
                    new THREE.TorusGeometry(0.16, 0.04, 6, 12),
                    metalEscuro
                );
                anel.rotation.x = Math.PI / 2;
                anel.position.y = hy;
                g.add(anel);
            });

            // Braço curvo
            const braco = new THREE.Mesh(
                new THREE.BoxGeometry(1.4, 0.08, 0.08),
                metal
            );
            braco.position.set(0.55, 6.5, 0);
            g.add(braco);
            // Suporte diagonal
            const suporte = new THREE.Mesh(
                new THREE.BoxGeometry(0.9, 0.05, 0.05),
                metal
            );
            suporte.position.set(0.35, 6.15, 0);
            suporte.rotation.z = -0.5;
            g.add(suporte);

            // Luminária
            const cupula = new THREE.Mesh(
                new THREE.SphereGeometry(0.28, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2),
                new THREE.MeshStandardMaterial({ color: 0x444450, metalness: 0.7, roughness: 0.3 })
            );
            cupula.position.set(1.1, 6.45, 0);
            g.add(cupula);
            const vidro = new THREE.Mesh(
                new THREE.SphereGeometry(0.22, 10, 8),
                new THREE.MeshStandardMaterial({
                    color: 0xfff5cc, emissive: 0xffeebb, emissiveIntensity: 0.35,
                    transparent: true, opacity: 0.85
                })
            );
            vidro.position.set(1.1, 6.35, 0);
            g.add(vidro);

            g.position.set(x, 0, z);
            // Orienta o braço para fora da esquina (para a rua)
            scene.add(g);
            return g;
        }
        // Postes só em alguns quarteirões (não em todos), 1–2 quinas
        mapaQuarteiroes.forEach((q, qi) => {
            if (q.tipo === 'lago') return;
            if (qi % 3 !== 0) return; // só ~1/3 dos quarteirões
            const m = QUARTEIRAO / 2 - 3;
            const quinas = [
                [q.cx - m, q.cz - m, Math.PI / 4],
                [q.cx + m, q.cz - m, -Math.PI / 4],
                [q.cx - m, q.cz + m, 3 * Math.PI / 4],
                [q.cx + m, q.cz + m, -3 * Math.PI / 4]
            ];
            // Escolhe 1 ou 2 quinas aleatórias
            const n = 1 + Math.floor(Math.random() * 2);
            for (let k = 0; k < n; k++) {
                const idx = Math.floor(Math.random() * quinas.length);
                const [px, pz, rot] = quinas.splice(idx, 1)[0];
                const poste = criarPosteLuz(px, pz);
                poste.rotation.y = rot;
            }
        });

        // ==================== CARRO ====================
        const carro = new THREE.Group();

        // ===== CARRO ESPORTIVO DETALHADO =====
        const pintura = new THREE.MeshStandardMaterial({
            color: 0xff0505, metalness: 0.65, roughness: 0.1,
            emissive: 0x880000, emissiveIntensity: 0.3
        });
        const pinturaEscura = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 0.85, roughness: 0.25 });
        const vidroAzul = new THREE.MeshStandardMaterial({
            color: 0x1a9fff, transparent: true, opacity: 0.58,
            metalness: 0.9, roughness: 0.05, emissive: 0x0088ee, emissiveIntensity: 0.55
        });
        const cromado = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.95, roughness: 0.08 });

        // Chassi inferior
        const chassi = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.22, 3.4), pinturaEscura);
        chassi.position.y = 0.28;
        chassi.castShadow = true;
        carro.add(chassi);

        // Corpo principal (baixo e alongado)
        const corpo = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.38, 3.1), pintura);
        corpo.position.y = 0.52;
        corpo.castShadow = true;
        carro.add(corpo);

        // Capô (ligeiramente mais baixo na frente)
        const capo = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.12, 1.0), pintura);
        capo.position.set(0, 0.72, 0.95);
        capo.rotation.x = 0.08;
        capo.castShadow = true;
        carro.add(capo);

        // Entradas de ar no capô
        const entradaMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        [[-0.35, 0.78, 0.9], [0.35, 0.78, 0.9]].forEach(pos => {
            const e = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.06, 0.45), entradaMat);
            e.position.set(...pos);
            carro.add(e);
        });

        // Cabine / teto esportivo
        const cabine = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.38, 1.35), pintura);
        cabine.position.set(0, 0.9, -0.15);
        cabine.castShadow = true;
        carro.add(cabine);

        // Para-brisa frontal azul
        const parabrisa = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.38, 0.06), vidroAzul);
        parabrisa.position.set(0, 0.92, 0.52);
        parabrisa.rotation.x = -0.35;

        function iniciarPassagemAviao() {
            // Percorre o mapa inteiro
            const eixo = Math.random() > 0.5 ? 'x' : 'z';
            const sentido = Math.random() > 0.5 ? 1 : -1;
            const altura = 45 + Math.random() * 35;
            const margem = half + 80;
            if (eixo === 'x') {
                aviao.position.set(-sentido * margem, altura, (Math.random() - 0.5) * half * 1.5);
                aviaoVel.x = sentido * (28 + Math.random() * 12);

            } else {
                aviao.position.set((Math.random() - 0.5) * half * 1.5, altura, -sentido * margem);
                aviaoVel.x = (Math.random() - 0.5) * 4;
                aviaoVel.z = sentido * (28 + Math.random() * 12);

            aviao.rotation.y = Math.atan2(aviaoVel.x, aviaoVel.z);
            aviao.visible = true;
            aviaoAtivo = true;

            if (!aviaoAtivo) {

                }
                return;
            }
            aviao.position.x += aviaoVel.x * dt;
            aviao.position.z += aviaoVel.z * dt;
            aviao.position.y += Math.sin(performance.now() * 0.001) * 0.04;
            const lim = half + 120;
            if (Math.abs(aviao.position.x) > lim || Math.abs(aviao.position.z) > lim) {

                    const lado = Math.random() > 0.5 ? -0.35 : 0.35;

                    fp.vz = -cos * 0.5 + (Math.random() - 0.5) * 0.4;
